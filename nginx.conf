# ── API: api-fotos.example.org ────────────────────────────────────────
server {
    listen 80;
    listen 443 ssl;
    server_name api-fotos.example.org;
    ssl_certificate /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3555;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        client_max_body_size 0;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }
}

# ── Frontend: fotos.example.org ───────────────────────────────────────
server {
    listen 80;
    listen 443 ssl;
    server_name fotos.example.org;
    ssl_certificate /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;
    root /mnt/almacenamiento/server/entrega_de_fotos/client;
    index index.html;

    location ^~ /api/admin/ {
        allow 100.119.0.0/16;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3555/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 0;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3555/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 0;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    location /admin/ {
        allow 100.119.0.0/16;
        allow 127.0.0.1;
        deny all;
        try_files $uri $uri/ /admin/index.html;
    }

    location ~* ^/(admin/.*|shared)\.js$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    location ~ ^/p/([^/]+)$ {
        set $slug $1;
        rewrite ^ /gallery/index.html?slug=$slug last;
    }

    location /gallery/ {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|png|jpg|svg|ico|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    location = /portafolio-foto {
        try_files /index.html =404;
    }

    location = /gallery-search {
        try_files /index.html =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
