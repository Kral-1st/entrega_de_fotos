server {
    listen 80;
    server_name api-fotos.carlangas.dpdns.org;
    location / {
        proxy_pass http://127.0.0.1:3555;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "no-store, no-cache, must-revalidate";

        # Para uploads grandes
        client_max_body_size 0;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
server {
    listen 443 ssl;
    server_name api-fotos.carlangas.dpdns.org;
    ssl_certificate /ruta/al/letsencrypt/fullchain.pem;
    ssl_certificate_key /ruta/al/letsencrypt/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:3555;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "no-store, no-cache, must-revalidate";

        # Para uploads grandes
        client_max_body_size 0;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }
}

# ── Frontend: fotos.carlangas.dpdns.org ───────────────────────────────────────
server {
    listen 443 ssl;
    server_name fotos.carlangas.dpdns.org;
    ssl_certificate /ruta/al/letsencrypt/fullchain.pem;
    ssl_certificate_key /ruta/al/letsencrypt/privkey.pem;
    root /mnt/almacenamiento/server/entrega_de_fotos/client;
    index index.html;

    # Proxy interno de la API — mismo origen que el frontend
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3555/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        client_max_body_size 0;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # Admin panel
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # JS del admin y shared — sin caché
    location ~* ^/(admin/.*|shared)\.js$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    # Galería pública: /p/:slug → gallery/index.html?slug=:slug
    location ~ ^/p/([^/]+)$ {
        set $slug $1;
        rewrite ^ /gallery/index.html?slug=$slug last;
    }

    # Archivos estáticos del gallery
    location /gallery/ {
        try_files $uri $uri/ =404;
    }

    # Shared assets con caché
    location ~* \.(css|js|png|jpg|svg|ico|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Default - redirigir al admin
    location = / {
        try_files /index.html =404;
    }
}
