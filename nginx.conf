server {
    listen 80;
    server_name api-example.org;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name api-example.org;
    ssl_certificate /ruta/al/letsencrypt/fullchain.pem;
    ssl_certificate_key /ruta/al/letsencrypt/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:3555;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "no-store, no-cache, must-revalidate";

        # Para uploads grandes
        client_max_body_size 0;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }
}

# ── Frontend: example.org ───────────────────────────────────────
server {
    listen 443 ssl;
    server_name example.org;
    ssl_certificate /ruta/al/letsencrypt/fullchain.pem;
    ssl_certificate_key /ruta/al/letsencrypt/privkey.pem;
    root /mnt/almacenamiento/server/entrega_de_fotos/client;
    index index.html;

    # API de admin — solo accesible vía Netbird
    location ^~ /api/admin/ {
        allow 100.119.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://127.0.0.1:3555/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        client_max_body_size 0;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # Proxy interno de la API — mismo origen que el frontend
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3555/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        client_max_body_size 0;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # Admin panel — solo accesible vía Netbird
    location /admin/ {
        allow 100.119.0.0/16;
        allow 127.0.0.1;
        deny all;
        try_files $uri $uri/ /admin/index.html;
    }

    # JS del admin y shared — sin caché
    location ~* ^/(admin/.*|shared)\.js$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    # Galería pública: /p/:slug → gallery/index.html?slug=:slug
    location ~ ^/p/([^/]+)$ {
        set $slug $1;
        rewrite ^ /gallery/index.html?slug=$slug last;
    }

    # Archivos estáticos del gallery
    location /gallery/ {
        try_files $uri $uri/ =404;
    }

    # Shared assets con caché
    location ~* \.(css|js|png|jpg|svg|ico|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Refresh en /gallery-search no debe 404 (URL cosmética del modal de búsqueda)
    location = /gallery-search {
        try_files /index.html =404;
    }

    # Refresh en /portafolio-foto no debe 404 (URL cosmética del lightbox)
    location = /portafolio-foto {
        try_files /index.html =404;
    }

    # Default - redirigir al admin
    location = / {
        try_files /index.html =404;
    }

    # Cualquier otro archivo estático de primer nivel (ej. /privacidad.html)
    location / {
        try_files $uri =404;
    }
}
server {
    listen 80;
    server_name example.org;
    return 301 https://$host$request_uri;
}
